<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Crossword Status</title>
<style>
  :root {
    --bg: #fafaf9; --fg: #1c1917; --muted: #78716c;
    --card: #fff; --border: #e7e5e4;
    --green: #16a34a; --green-bg: #f0fdf4; --green-border: #bbf7d0;
    --red: #dc2626; --red-bg: #fef2f2; --red-border: #fecaca;
    --amber: #d97706; --amber-bg: #fffbeb; --amber-border: #fde68a;
    --gray: #9ca3af; --gray-bg: #f9fafb; --gray-border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --fg: #fafaf9; --muted: #a8a29e;
      --card: #292524; --border: #44403c;
      --green: #4ade80; --green-bg: #14532d; --green-border: #166534;
      --red: #f87171; --red-bg: #7f1d1d; --red-border: #991b1b;
      --amber: #fbbf24; --amber-bg: #78350f; --amber-border: #92400e;
      --gray: #9ca3af; --gray-bg: #374151; --gray-border: #4b5563;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
    padding: 1.5rem; max-width: 420px; margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 1.25rem; font-weight: 600; }
  .date { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }

  .steps { margin-top: 1.25rem; display: flex; flex-direction: column; gap: 0.5rem; }

  .step {
    padding: 0.85rem 1rem; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card);
    transition: all 0.15s;
  }
  .step-header {
    display: flex; align-items: center; justify-content: space-between;
  }
  .step-left { display: flex; align-items: center; gap: 0.5rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .step-name { font-weight: 600; font-size: 0.95rem; }
  .step-time { font-size: 0.8rem; color: var(--muted); }

  .step-detail {
    display: none; margin-top: 0.65rem; padding-top: 0.65rem;
    border-top: 1px solid var(--border);
    font-size: 0.85rem; color: var(--muted); line-height: 1.6;
  }
  .step.expanded .step-detail { display: block; }

  .step.s-success { border-color: var(--green-border); background: var(--green-bg); }
  .step.s-success .dot { background: var(--green); }
  .step.s-error { border-color: var(--red-border); background: var(--red-bg); }
  .step.s-error .dot { background: var(--red); }
  .step.s-pending { border-color: var(--amber-border); background: var(--amber-bg); }
  .step.s-pending .dot { background: var(--amber); animation: pulse 1.5s infinite; }
  .step.s-none { border-color: var(--gray-border); background: var(--gray-bg); }
  .step.s-none .dot { background: var(--gray); }

  .error-msg {
    margin-top: 0.4rem; padding: 0.6rem; border-radius: 6px;
    background: var(--red-bg); color: var(--red); font-size: 0.8rem; line-height: 1.4;
  }
  .hint {
    margin-top: 0.35rem; font-size: 0.78rem; color: var(--muted); font-style: italic;
  }

  .btn {
    display: block; width: 100%; margin-top: 0.6rem;
    padding: 0.65rem; border: none; border-radius: 8px;
    font-size: 0.85rem; font-weight: 600; cursor: pointer;
    background: var(--fg); color: var(--bg);
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.7; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .footer {
    margin-top: 1.25rem; font-size: 0.75rem; color: var(--muted); text-align: center;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
  }
</style>
</head>
<body>
<h1>NYT Crossword</h1>
<div class="date" id="dateDisplay"></div>
<div class="steps" id="app"></div>
<div class="footer" id="footer"></div>

<script>
const REPO = 'mediajunkie/nyt-crossword';
const STATUS_URL = `https://api.github.com/repos/${REPO}/contents/docs/status.json`;
const DISPATCH_URL = `https://api.github.com/repos/${REPO}/actions/workflows/rerun.yml/dispatches`;

const TYPE_LABELS = {
  weekday: 'Weekday', saturday: 'Saturday', sunday: 'Sunday',
  'sunday-magazine': 'Sunday (Magazine)', facsimile: 'Facsimile'
};

function formatDate(d) {
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}
function formatTime(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
function formatSize(bytes) {
  return bytes ? Math.round(bytes / 1024) + 'KB' : '';
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getHint(step, error) {
  if (!error) return '';
  const e = error.toLowerCase();
  if (step === 'fetch') {
    if (e.includes('401') || e.includes('403') || e.includes('auth') || e.includes('cookie')) {
      return 'Cookie expired. In Chrome (me profile): nytimes.com \u2192 DevTools (Cmd+Opt+I) \u2192 Application \u2192 Cookies \u2192 copy NYT-S value \u2192 update cookies.txt';
    }
    if (e.includes('fetch') || e.includes('network') || e.includes('timeout')) {
      return 'Transient network error \u2014 tap Retry to try again.';
    }
  }
  if (step === 'print') {
    if (e.includes('unreachable') || e.includes('printer')) {
      return 'Check printer: power, toner, paper, network.';
    }
  }
  if (step === 'remarkable') {
    return 'reMarkable upload issue \u2014 tap Retry.';
  }
  return '';
}

function getToken() {
  let t = localStorage.getItem('gh_token');
  if (!t) {
    t = prompt('GitHub personal access token (actions:write scope):');
    if (t) localStorage.setItem('gh_token', t);
  }
  return t;
}

async function requestRerun(step) {
  const token = getToken();
  if (!token) return;

  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Requesting...';

  try {
    const resp = await fetch(DISPATCH_URL, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github.v3+json'
      },
      body: JSON.stringify({ ref: 'main', inputs: { step: step } })
    });
    if (resp.status === 204) {
      btn.textContent = 'Requested!';
      setTimeout(loadStatus, 10000);
    } else if (resp.status === 401) {
      localStorage.removeItem('gh_token');
      btn.textContent = 'Bad token \u2014 tap to retry';
      btn.disabled = false;
    } else {
      btn.textContent = `Error (${resp.status})`;
      setTimeout(() => { btn.textContent = 'Retry'; btn.disabled = false; }, 5000);
    }
  } catch (e) {
    btn.textContent = 'Network error';
    setTimeout(() => { btn.textContent = 'Retry'; btn.disabled = false; }, 5000);
  }
}

function toggleStep(el) {
  el.classList.toggle('expanded');
}

function stepClass(status) {
  if (status === 'success') return 's-success';
  if (status === 'error') return 's-error';
  if (status === 'pending') return 's-pending';
  return 's-none';
}

function renderStep(name, label, stepData, showRetry) {
  if (!stepData) {
    return `<div class="step s-none" onclick="toggleStep(this)">
      <div class="step-header">
        <div class="step-left"><div class="dot"></div><span class="step-name">${label}</span></div>
        <span class="step-time">\u2014</span>
      </div>
      <div class="step-detail">
        Not yet attempted
        ${showRetry ? `<button class="btn" onclick="event.stopPropagation(); requestRerun('${name}')">Run ${label}</button>` : ''}
      </div>
    </div>`;
  }

  const status = stepData.status || 'none';
  const time = formatTime(stepData.at);
  let details = '';

  // Step-specific details
  if (name === 'fetch' && status === 'success') {
    const parts = [];
    if (stepData.pdf_size) parts.push(formatSize(stepData.pdf_size));
    if (stepData.page_count) parts.push(stepData.page_count + 'pg');
    if (stepData.puzzle_id) parts.push('#' + stepData.puzzle_id);
    if (parts.length) details += parts.join(' \u00b7 ');
  }
  if (name === 'print' && status === 'success' && stepData.method) {
    const methods = { local: 'Local printer', 'relay-waiting': 'Sent to relay (waiting)', 'relay-printed': 'Printed via relay' };
    details += methods[stepData.method] || stepData.method;
  }

  let errorHtml = '';
  if (status === 'error' && stepData.error) {
    const hint = getHint(name, stepData.error);
    errorHtml = `<div class="error-msg">${stepData.error}</div>`;
    if (hint) errorHtml += `<div class="hint">${hint}</div>`;
  }

  const retryBtn = (status === 'error' || showRetry)
    ? `<button class="btn" onclick="event.stopPropagation(); requestRerun('${name}')">Retry ${label}</button>`
    : '';

  return `<div class="step ${stepClass(status)}" onclick="toggleStep(this)">
    <div class="step-header">
      <div class="step-left"><div class="dot"></div><span class="step-name">${label}</span></div>
      <span class="step-time">${time}</span>
    </div>
    <div class="step-detail">
      ${details}
      ${errorHtml}
      ${retryBtn}
    </div>
  </div>`;
}

async function loadStatus() {
  const today = todayStr();
  const now = new Date();
  document.getElementById('dateDisplay').textContent = formatDate(now);

  let data = null;
  try {
    const resp = await fetch(STATUS_URL + '?t=' + Date.now(), {
      headers: { 'Accept': 'application/vnd.github.v3+json' }
    });
    if (resp.ok) {
      const json = await resp.json();
      data = JSON.parse(atob(json.content));
    }
  } catch (e) {}

  const app = document.getElementById('app');
  const isToday = data && data.date === today;
  const hour = now.getHours();

  if (!isToday) {
    if (hour < 7) {
      app.innerHTML = `<div class="step s-none">
        <div class="step-header">
          <div class="step-left"><div class="dot"></div><span class="step-name">Scheduled for 6:30 AM</span></div>
        </div>
      </div>`;
    } else {
      app.innerHTML = `<div class="step s-none" onclick="toggleStep(this)">
        <div class="step-header">
          <div class="step-left"><div class="dot"></div><span class="step-name">No data for today</span></div>
        </div>
        <div class="step-detail">
          ${data ? 'Last run: ' + data.date : 'No status data found'}
          <button class="btn" onclick="event.stopPropagation(); requestRerun('all')">Run Now</button>
        </div>
      </div>`;
    }
  } else {
    // Determine puzzle type label for header
    const typeLabel = data.puzzle_type ? (TYPE_LABELS[data.puzzle_type] || data.puzzle_type) : '';
    const dateHeader = typeLabel ? `<div style="font-size:0.8rem; color:var(--muted); margin-bottom:0.25rem">${typeLabel}</div>` : '';

    app.innerHTML = dateHeader
      + renderStep('fetch', 'Fetched', data.fetch, false)
      + renderStep('remarkable', 'reMarkable', data.remarkable, data.fetch && data.fetch.status === 'success')
      + renderStep('print', 'Printed', data.print, data.fetch && data.fetch.status === 'success');
  }

  document.getElementById('footer').textContent = 'Updated ' + now.toLocaleTimeString();

  // Auto-refresh: 15s if any step is pending, 60s otherwise
  const anyPending = isToday && data && ['fetch','remarkable','print'].some(s => data[s] && data[s].status === 'pending');
  setTimeout(loadStatus, anyPending ? 15000 : 60000);
}

loadStatus();
</script>
</body>
</html>
